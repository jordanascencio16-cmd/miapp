<!DOCTYPE html>
<html>
<head>
<title>Error</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        background: radial-gradient(ellipse at center, #2d0020 0%, #0a0008 100%);
        color: #fff;
        font-family: 'Cormorant Garamond', serif;
        text-align: center;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    h1 {
        font-family: 'Great Vibes', cursive;
        font-size: 3.5rem;
        color: #ffb6c1;
        text-shadow: 0 0 20px rgba(255,105,180,0.5);
        margin-bottom: 1.5rem;
    }

    p {
        font-size: 1.1rem;
        color: rgba(255,182,193,0.6);
        font-style: italic;
        margin-bottom: 2rem;
        letter-spacing: 2px;
    }

    a {
        color: #ffb6c1;
        font-style: italic;
        font-size: 1rem;
        text-decoration: none;
        border: 1px solid rgba(255,182,193,0.3);
        padding: 0.7rem 2.5rem;
        border-radius: 50px;
        letter-spacing: 2px;
        transition: all 0.3s;
    }

    a:hover {
        background: rgba(255,105,180,0.2);
    }
</style>
</head>
<body>
    <h1>Fecha incorrecta</h1>
    <p>esa no es la fecha especial, intentalo de nuevo</p>
    <a href="/">Volver</a>
</body>
</html>
